[project]
name = "scholaredge-backend"
version = "0.1.0"
description = "ScholarEdge backend - On-device AI research and learning copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "pypdf>=4.1.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: opt-in tests that require real external API connectivity (deselected by default)",
]
addopts = "-m 'not live'"
